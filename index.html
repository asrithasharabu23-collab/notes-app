<!DOCTYPE html>
<html>
<body>

<h2>Smart Notes App</h2>

<h3>Register</h3>
<input id="ruser" placeholder="username">
<input id="rpass" placeholder="password">
<button onclick="register()">Register</button>

<h3>Login</h3>
<input id="luser" placeholder="username">
<input id="lpass" placeholder="password">
<button onclick="login()">Login</button>

<hr>

<h3>Add Note</h3>
<input id="note">
<button onclick="addNote()">Add</button>

<ul id="list"></ul>

<script>
const BASE_URL = "http://192.168.183.75:5000";
let user_id = null;

async function register() {
    await fetch(BASE_URL + "/register", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            username: ruser.value,
            password: rpass.value
        })
    });
    alert("Registered!");
}

async function login() {
    let res = await fetch(BASE_URL + "/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            username: luser.value,
            password: lpass.value
        })
    });

    let data = await res.json();

    if (data.status === "success") {
        user_id = data.user_id;
        alert("Login success");
        loadNotes();
    } else {
        alert("Login failed");
    }
}

async function addNote() {
    await fetch(BASE_URL + "/add_note", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            user_id,
            content: note.value
        })
    });

    loadNotes();
}

async function loadNotes() {
    let res = await fetch(BASE_URL + "/get_notes/" + user_id);
    let data = await res.json();

    list.innerHTML = "";

    data.forEach(n => {
        let li = document.createElement("li");
        li.innerHTML = n[1] + " <button onclick='del("+n[0]+")'>X</button>";
        list.appendChild(li);
    });
}

async function del(id) {
    await fetch(BASE_URL + "/delete/" + id);
    loadNotes();
}
</script>

</body>
</html>
